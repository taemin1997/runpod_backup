[project]
name = "workspace"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    "accelerate>=1.15.0",
    "dotenv>=0.9.9",
    "openai>=3.22.1",
    "python-dotenv>=1.2.4",
    "torch==2.8.0",
    "torchvision==0.23.0",
    "transformers<5.2",
]

[project.scripts]
workspace = "workspace:main"

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"